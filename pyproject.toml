[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datavigil"
version = "0.1.0"
description = "Independent, open-source data quality & profiling platform (DataVigil)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Shailendra Rai" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "requests>=2.31",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
aurora = ["psycopg2-binary>=2.9", "boto3>=1.34"]
bedrock = ["boto3>=1.34"]
mcp = ["mcp>=1.0", "awslabs.postgres-mcp-server>=1.2"]
reports = ["python-docx>=1.1", "reportlab>=4.0"]
mysql = ["pymysql>=1.1"]
sqlserver = ["pyodbc>=5.0"]
oracle = ["oracledb>=2.0"]
snowflake = ["snowflake-sqlalchemy>=1.5"]
all = ["psycopg2-binary>=2.9", "pymysql>=1.1", "pyodbc>=5.0", "oracledb>=2.0", "snowflake-sqlalchemy>=1.5"]
full = ["psycopg2-binary>=2.9", "boto3>=1.34", "mcp>=1.0",
        "awslabs.postgres-mcp-server>=1.2", "python-docx>=1.1", "reportlab>=4.0"]

[project.scripts]
datavigil = "datavigil.cli:app"

[tool.setuptools.packages.find]
include = ["datavigil*"]

[tool.setuptools.package-data]
datavigil = ["web/templates/*.html", "web/static/*"]
